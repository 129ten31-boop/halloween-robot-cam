<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<title>Skeleton Costume Camera</title>
<style>
* { box-sizing: border-box; }
body {
margin: 0; padding: 16px;
background: #10131b; color: white;
font-family: sans-serif; text-align: center;
}
h1 { font-size: 23px; }
p { line-height: 1.5; }
button {
padding: 13px 16px; margin: 4px;
border: 0; border-radius: 10px;
font-size: 16px; font-weight: bold;
}
#start { background: #e6f2ff; color: #111; }
#switch { background: #444d5b; color: white; }
#screen {
display: block; width: 100%; max-width: 600px;
height: auto; margin: 14px auto;
border-radius: 14px; background: #202b36;
}
#status { color: #bcecff; font-size: 14px; }
video { display: none; }
</style>
</head>
<body>
<h1>💀 SKELETON COSTUME</h1>
<p>緑タイツを骸骨風に変身！<br>
全身を映して、明るい場所で使ってね。</p>
<button id="start">カメラを起動</button>
<button id="switch">外・内カメラ切替</button>
<p id="status">カメラを起動してください</p>

<video id="video" autoplay muted playsinline></video>
<canvas id="screen"></canvas>

<script type="module">
import {
FilesetResolver,
PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video = document.getElementById("video");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", { alpha: false });
const status = document.getElementById("status");

const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d", {
willReadFrequently: true
});
const boneCanvas = document.createElement("canvas");
const boneCtx = boneCanvas.getContext("2d");

let stream = null;
let pose = null;
let running = false;
let starting = false;
let backCamera = true;
let lastTime = -1;
let busy = false;

const MODEL =
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

async function initPose() {
if (pose) return;

status.textContent = "全身認識モデルを読み込み中…";

const vision = await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
);

pose = await PoseLandmarker.createFromOptions(vision, {
baseOptions: { modelAssetPath: MODEL },
runningMode: "VIDEO",
numPoses: 1,
minPoseDetectionConfidence: 0.5,
minPosePresenceConfidence: 0.5,
minTrackingConfidence: 0.5
});
}

async function startCamera() {
if (starting) return;
starting = true;
running = false;

try {
if (!navigator.mediaDevices?.getUserMedia) {
throw new Error("Camera API unavailable");
}

if (stream) {
stream.getTracks().forEach(t => t.stop());
stream = null;
}

stream = await navigator.mediaDevices.getUserMedia({
audio: false,
video: {
facingMode: backCamera ? "environment" : "user",
width: { ideal: 960 },
height: { ideal: 720 }
}
});

video.srcObject = stream;
await video.play();
await initPose();

lastTime = -1;
running = true;
status.textContent = "全身と緑タイツを映してください";
requestAnimationFrame(render);
} catch (e) {
console.error(e);
status.textContent =
"起動できません。Safariのカメラ許可と通信を確認してください。";
if (stream) stream.getTracks().forEach(t => t.stop());
stream = null;
} finally {
starting = false;
}
}

function setupCanvas(w, h) {
for (const c of [canvas, maskCanvas, boneCanvas]) {
if (c.width !== w || c.height !== h) {
c.width = w;
c.height = h;
}
}
}

/*
* 緑色のピクセルだけをマスクにする。
* 照明やタイツの色によって検出精度は変わります。
*/
function makeGreenMask(w, h) {
maskCtx.clearRect(0, 0, w, h);
maskCtx.drawImage(video, 0, 0, w, h);

const frame = maskCtx.getImageData(0, 0, w, h);
const d = frame.data;

for (let i = 0; i < d.length; i += 4) {
const r = d[i], g = d[i + 1], b = d[i + 2];

// 緑優勢の色を検出
const isGreen =
g > 55 &&
g > r * 1.22 &&
g > b * 1.12 &&
(g - Math.max(r, b)) > 20;

d[i] = 255;
d[i + 1] = 255;
d[i + 2] = 255;
d[i + 3] = isGreen ? 255 : 0;
}

maskCtx.putImageData(frame, 0, 0);
}

function point(lm, w, h) {
return {
x: lm.x * w,
y: lm.y * h,
v: lm.visibility ?? 1
};
}

function visible(p) {
return p && p.v > 0.35 &&
Number.isFinite(p.x) &&
Number.isFinite(p.y);
}

/*
* 骨を描く。実際に表示するのは緑タイツ部分に
* 重なった部分だけです。
*/
function bone(a, b, width) {
if (!visible(a) || !visible(b)) return;

const dx = b.x - a.x;
const dy = b.y - a.y;
const len = Math.hypot(dx, dy);
if (len < 3) return;

boneCtx.lineCap = "round";
boneCtx.lineJoin = "round";

// 骨の外側の輪郭
boneCtx.beginPath();
boneCtx.moveTo(a.x, a.y);
boneCtx.lineTo(b.x, b.y);
boneCtx.strokeStyle = "#342d28";
boneCtx.lineWidth = width;
boneCtx.stroke();

// 骨の中心
boneCtx.beginPath();
boneCtx.moveTo(a.x, a.y);
boneCtx.lineTo(b.x, b.y);
boneCtx.strokeStyle = "#f5edda";
boneCtx.lineWidth = width * 0.70;
boneCtx.stroke();

// 骨の端のふくらみ
for (const p of [a, b]) {
boneCtx.beginPath();
boneCtx.arc(p.x, p.y, width * 0.40, 0, Math.PI * 2);
boneCtx.fillStyle = "#f5edda";
boneCtx.fill();
boneCtx.strokeStyle = "#342d28";
boneCtx.lineWidth = Math.max(1, width * 0.10);
boneCtx.stroke();
}

// 骨の内部の陰影
boneCtx.beginPath();
boneCtx.moveTo(a.x, a.y);
boneCtx.lineTo(b.x, b.y);
boneCtx.strokeStyle = "rgba(125,105,83,0.5)";
boneCtx.lineWidth = Math.max(1, width * 0.10);
boneCtx.stroke();
}

function rib(a, b, midX, midY, width) {
if (!visible(a) || !visible(b)) return;

boneCtx.beginPath();
boneCtx.moveTo(a.x, a.y);
boneCtx.quadraticCurveTo(midX, midY, b.x, b.y);
boneCtx.lineCap = "round";
boneCtx.strokeStyle = "#342d28";
boneCtx.lineWidth = width;
boneCtx.stroke();

boneCtx.beginPath();
boneCtx.moveTo(a.x, a.y);
boneCtx.quadraticCurveTo(midX, midY, b.x, b.y);
boneCtx.strokeStyle = "#f5edda";
boneCtx.lineWidth = width * 0.68;
boneCtx.stroke();
}

function drawSkeleton(lm, w, h) {
const p = i => point(lm[i], w, h);

const nose = p(0);
const ls = p(11), rs = p(12);
const le = p(13), re = p(14);
const lw = p(15), rw = p(16);
const lh = p(23), rh = p(24);
const lk = p(25), rk = p(26);
const la = p(27), ra = p(28);
const lheel = p(29), rheel = p(30);
const lfoot = p(31), rfoot = p(32);

if (!visible(ls) || !visible(rs) ||
!visible(lh) || !visible(rh)) return false;

const shoulderW = Math.hypot(ls.x-rs.x, ls.y-rs.y);
const scale = Math.max(12, shoulderW);

// 胴体の中心
const midS = {
x: (ls.x + rs.x) / 2,
y: (ls.y + rs.y) / 2,
v: 1
};
const midH = {
x: (lh.x + rh.x) / 2,
y: (lh.y + rh.y) / 2,
v: 1
};

boneCtx.clearRect(0, 0, w, h);

// 鎖骨
bone(ls, rs, scale * 0.085);

// 胸骨
const sternumTop = {
x: midS.x,
y: midS.y + scale * 0.06,
v: 1
};
const sternumBottom = {
x: midH.x,
y: midS.y + (midH.y-midS.y) * 0.50,
v: 1
};
bone(sternumTop, sternumBottom, scale * 0.10);

// 肋骨：肩から腰までの範囲に描く
for (let i = 1; i <= 5; i++) {
const t = i / 6;
const y = midS.y + (midH.y - midS.y) * t;
const half = shoulderW * (0.43 - t * 0.16);
const a = { x: midS.x-half, y, v: 1 };
const b = { x: midS.x+half, y, v: 1 };
const curveY = y + scale * 0.13;
rib(a, b, midS.x, curveY, scale * 0.065);
}

// 骨盤
bone(lh, rh, scale * 0.12);
bone(lh, midH, scale * 0.07);
bone(rh, midH, scale * 0.07);

// 腕
bone(ls, le, scale * 0.13);
bone(le, lw, scale * 0.105);
bone(rs, re, scale * 0.13);
bone(re, rw, scale * 0.105);

// 脚
bone(lh, lk, scale * 0.16);
bone(lk, la, scale * 0.13);
bone(rh, rk, scale * 0.16);
bone(rk, ra, scale * 0.13);

// 足の骨
bone(la, lheel, scale * 0.075);
bone(ra, rheel, scale * 0.075);
bone(la, lfoot, scale * 0.07);
bone(ra, rfoot, scale * 0.07);

// 緑色の領域だけに骨の描画を残す
boneCtx.globalCompositeOperation = "destination-in";
boneCtx.drawImage(maskCanvas, 0, 0, w, h);
boneCtx.globalCompositeOperation = "source-over";

ctx.drawImage(boneCanvas, 0, 0, w, h);

return true;
}

function render() {
if (!running || busy) return;

if (video.readyState >= 2 &&
video.currentTime !== lastTime) {
busy = true;
lastTime = video.currentTime;

try {
const w = video.videoWidth;
const h = video.videoHeight;

if (w && h) {
setupCanvas(w, h);

// 元の映像を表示
ctx.drawImage(video, 0, 0, w, h);

// 緑タイツの領域を抽出
makeGreenMask(w, h);

// 姿勢を検出して骨を重ねる
const result = pose.detectForVideo(
video, performance.now()
);
const landmarks = result.landmarks?.[0];

if (landmarks &&
drawSkeleton(landmarks, w, h)) {
status.textContent =
"💀 骨の模様を表示中｜緑タイツを映してね";
} else {
status.textContent =
"全身が映るようにカメラを調整してね";
}
}
} catch (e) {
console.error(e);
status.textContent =
"処理中にエラーが発生しました。再起動してください。";
} finally {
busy = false;
}
}

if (running) requestAnimationFrame(render);
}

document.getElementById("start").addEventListener(
"click", startCamera
);

document.getElementById("switch").addEventListener(
"click", async () => {
backCamera = !backCamera;
await startCamera();
}
);

window.addEventListener("pagehide", () => {
running = false;
if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
