
<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Halloween Robot Cam</title>

<style>

  body {

    margin: 0; padding: 16px;

    background: #151521; color: white;

    font-family: system-ui, sans-serif;

    text-align: center;

  }

  h1 { color: #ffad42; font-size: 25px; }

  canvas {

    display: block; width: 100%; max-width: 480px;

    margin: 14px auto; background: #242432;

    border-radius: 12px;

  }

  button, input {

    accent-color: #ffad42;

  }
  </style>
</head>
<body>
    <h1>Halloween Robot Cam</h1>
    
    <!-- 映像や描画を表示するキャンバス -->
    <canvas id="camCanvas" width="480" height="360"></canvas>

    <!-- 操作用のボタンなど -->
    <div>
        <button id="startBtn">カメラ起動</button>
    </div>

    <script>
        // ここにカメラを動かしたりロボットを制御するJavaScriptを書きます
        const canvas = document.getElementById('camCanvas');
        const ctx = canvas.getContext('2d');
        
        // 例として、最初は「ハロウィン準備中...」という文字を表示させておく場合
        ctx.fillStyle = '#ffad42';
        ctx.font = '20px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('カメラ起動ボタンを押してください', canvas.width / 2, canvas.height / 2);

        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                // ブラウザのカメラ機能にアクセスするコード
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                
                video.addEventListener('loadeddata', () => {
                    function draw() {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        requestAnimationFrame(draw);
                    }
                    draw();
                });
            } catch (err) {
                alert('カメラの起動に失敗しました: ' + err);
            }
        });
    </script>
</body>
</html>
