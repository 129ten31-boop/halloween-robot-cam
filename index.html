<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Costume Camera</title>
<style>
* { box-sizing: border-box; }
body {
margin: 0; padding: 16px;
background: #0c131c; color: white;
font-family: sans-serif; text-align: center;
}
h1 { font-size: 25px; }
p { line-height: 1.5; }
button {
padding: 12px 16px; margin: 4px;
border: 0; border-radius: 10px;
font-size: 16px; font-weight: bold;
}
#start { background: #45e4f1; }
#switch { background: #e0e5eb; }
#screen {
display: block; width: 100%; max-width: 600px;
margin: 14px auto; border-radius: 14px;
background: #202b36;
}
#status { color: #80f5ff; }
video { display: none; }
</style>
</head>
<body>
<h1>🤖 ROBOT COSTUME</h1>
<p>全身を映してロボット変身！</p>
<button id="start">カメラを起動</button>
<button id="switch">外カメラに切り替え</button>
<p id="status">カメラを起動してください</p>
<video id="video" autoplay muted playsinline></video>
<canvas id="screen"></canvas>

<script type="module">
import {
FilesetResolver,
PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video = document.getElementById("video");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let stream = null;
let pose = null;
let running = false;
let backCamera = true;
let lastTime = -1;
let starting = false;

const MODEL =
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

async function initPose() {
if (pose) return;
status.textContent = "全身追跡モデルを読み込み中…";

const vision = await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
);

pose = await PoseLandmarker.createFromOptions(vision, {
baseOptions: { modelAssetPath: MODEL },
runningMode: "VIDEO",
numPoses: 1,
minPoseDetectionConfidence: 0.5,
minPosePresenceConfidence: 0.5,
minTrackingConfidence: 0.5
});
}

async function startCamera() {
if (starting) return;
starting = true;
running = false;

try {
if (stream) stream.getTracks().forEach(t => t.stop());

stream = await navigator.mediaDevices.getUserMedia({
audio: false,
video: {
facingMode: backCamera ? "environment" : "user",
width: { ideal: 1280 },
height: { ideal: 720 }
}
});

video.srcObject = stream;
await video.play();
await initPose();

lastTime = -1;
running = true;
status.textContent = "全身を映してください";
requestAnimationFrame(render);
} catch (e) {
console.error(e);
status.textContent =
"起動できません。カメラの許可と通信を確認してください。";
} finally {
starting = false;
}
}

function point(lm, w, h) {
return { x: lm.x * w, y: lm.y * h, v: lm.visibility ?? 1 };
}

function visible(p) {
return p && p.v > 0.35 &&
Number.isFinite(p.x) && Number.isFinite(p.y);
}

function lineArmor(a, b, width, color = "#a9c2d4") {
if (!visible(a) || !visible(b)) return;

const dx = b.x - a.x, dy = b.y - a.y;
const len = Math.hypot(dx, dy);
if (len < 2) return;

const nx = -dy / len * width / 2;
const ny = dx / len * width / 2;

ctx.beginPath();
ctx.moveTo(a.x + nx, a.y + ny);
ctx.lineTo(b.x + nx, b.y + ny);
ctx.lineTo(b.x - nx, b.y - ny);
ctx.lineTo(a.x - nx, a.y - ny);
ctx.closePath();

const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
g.addColorStop(0, "#40586a");
g.addColorStop(0.35, color);
g.addColorStop(0.65, "#e6f1fa");
g.addColorStop(1, "#536d80");

ctx.fillStyle = g;
ctx.fill();
ctx.strokeStyle = "#263b4c";
ctx.lineWidth = 3;
ctx.stroke();

// 装甲の中心ライン
ctx.beginPath();
ctx.moveTo(a.x, a.y);
ctx.lineTo(b.x, b.y);
ctx.strokeStyle = "rgba(35,55,70,0.65)";
ctx.lineWidth = 2;
ctx.stroke();
}

function joint(p, r) {
if (!visible(p)) return;

ctx.beginPath();
ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
ctx.fillStyle = "#263b4c";
ctx.fill();
ctx.strokeStyle = "#5cefff";
ctx.lineWidth = 3;
ctx.stroke();

ctx.beginPath();
ctx.arc(p.x, p.y, r * 0.4, 0, Math.PI * 2);
ctx.fillStyle = "#bdfaff";
ctx.fill();
}

function drawRobot(lm, w, h) {
const p = i => point(lm[i], w, h);

// MediaPipe body landmark indices
const nose = p(0);
const ls = p(11), rs = p(12);
const le = p(13), re = p(14);
const lw = p(15), rw = p(16);
const lh = p(23), rh = p(24);
const lk = p(25), rk = p(26);
const la = p(27), ra = p(28);
const lheel = p(29), rheel = p(30);

if (!visible(ls) || !visible(rs) ||
!visible(lh) || !visible(rh)) return false;

const shoulderW = Math.hypot(ls.x-rs.x, ls.y-rs.y);
const hipW = Math.hypot(lh.x-rh.x, lh.y-rh.y);
const scale = Math.max(12, shoulderW);

// 胴体：肩と腰を結ぶ独立した胸・腹部装甲
const midS = { x:(ls.x+rs.x)/2, y:(ls.y+rs.y)/2, v:1 };
const midH = { x:(lh.x+rh.x)/2, y:(lh.y+rh.y)/2, v:1 };
const sx = Math.max(shoulderW * 0.13, 4);
const hx = Math.max(hipW * 0.12, 4);

ctx.beginPath();
ctx.moveTo(ls.x - sx, ls.y);
ctx.lineTo(rs.x + sx, rs.y);
ctx.lineTo(rh.x + hx, rh.y);
ctx.lineTo(lh.x - hx, lh.y);
ctx.closePath();

const bodyGrad = ctx.createLinearGradient(
ls.x, midS.y, rs.x, midH.y
);
bodyGrad.addColorStop(0, "#43596b");
bodyGrad.addColorStop(0.3, "#dbe8f2");
bodyGrad.addColorStop(0.65, "#8199aa");
bodyGrad.addColorStop(1, "#354b5d");
ctx.fillStyle = bodyGrad;
ctx.fill();
ctx.strokeStyle = "#243747";
ctx.lineWidth = 4;
ctx.stroke();

// 胸の中央装甲。体幅に応じてサイズが変わる
const chestTop = midS.y + (midH.y-midS.y)*0.12;
const chestBottom = midS.y + (midH.y-midS.y)*0.53;
const chestW = shoulderW * 0.56;

ctx.beginPath();
ctx.moveTo(midS.x-chestW/2, chestTop);
ctx.lineTo(midS.x+chestW/2, chestTop);
ctx.lineTo(midS.x+chestW*0.42, chestBottom);
ctx.lineTo(midS.x-chestW*0.42, chestBottom);
ctx.closePath();
ctx.fillStyle = "#304657";
ctx.fill();
ctx.strokeStyle = "#65edff";
ctx.lineWidth = 3;
ctx.stroke();

// 胸の発光コア
ctx.beginPath();
ctx.arc(midS.x, (chestTop+chestBottom)/2,
Math.max(4, scale*0.075), 0, Math.PI*2);
ctx.fillStyle = "#55efff";
ctx.fill();

// 肩・腕・肘・前腕
lineArmor(ls, le, scale*0.30);
lineArmor(le, lw, scale*0.23, "#92a9ba");
lineArmor(rs, re, scale*0.30);
lineArmor(re, rw, scale*0.23, "#92a9ba");

// 腰から膝、膝から足首
lineArmor(lh, lk, scale*0.34);
lineArmor(lk, la, scale*0.27, "#a4bacb");
lineArmor(rh, rk, scale*0.34);
lineArmor(rk, ra, scale*0.27, "#a4bacb");

// 足首から足先
if (visible(la) && visible(lheel)) lineArmor(la, lheel, scale*0.18);
if (visible(ra) && visible(rheel)) lineArmor(ra, rheel, scale*0.18);

// 関節のリング
[
[ls,scale*.16],[rs,scale*.16],
[le,scale*.105],[re,scale*.105],
[lw,scale*.09],[rw,scale*.09],
[lh,scale*.13],[rh,scale*.13],
[lk,scale*.12],[rk,scale*.12],
[la,scale*.09],[ra,scale*.09]
].forEach(([pt,r]) => joint(pt,r));

// 頭部：鼻と肩の位置から大きさを推定
if (visible(nose)) {
const headR = shoulderW * 0.20;
const headY = nose.y - headR*0.48;

ctx.beginPath();
ctx.ellipse(nose.x, headY, headR*0.78, headR, 0, 0, Math.PI*2);
const headGrad = ctx.createLinearGradient(
nose.x-headR, headY, nose.x+headR, headY
);
headGrad.addColorStop(0, "#455a6d");
headGrad.addColorStop(0.5, "#dceaf5");
headGrad.addColorStop(1, "#536b7e");
ctx.fillStyle = headGrad;
ctx.fill();
ctx.strokeStyle = "#263b4c";
ctx.lineWidth = 3;
ctx.stroke();

// バイザー
ctx.fillStyle = "#102433";
ctx.fillRect(
nose.x-headR*0.68,
headY-headR*0.12,
headR*1.36,
headR*0.32
);
ctx.fillStyle = "#55f2ff";
ctx.fillRect(
nose.x-headR*0.48,
headY-headR*0.02,
headR*0.96,
headR*0.07
);
}

return true;
}

function render() {
if (!running) return;
if (video.readyState >= 2 && video.currentTime !== lastTime) {
lastTime = video.currentTime;

const w = video.videoWidth, h = video.videoHeight;
if (w && h) {
if (canvas.width !== w || canvas.height !== h) {
canvas.width = w;
canvas.height = h;
}

ctx.drawImage(video, 0, 0, w, h);

try {
const result = pose.detectForVideo(video, performance.now());
const landmarks = result.landmarks?.[0];

if (landmarks && drawRobot(landmarks, w, h)) {
status.textContent = "🤖 全身追跡中";
} else {
status.textContent = "全身が映るようにカメラを調整してね";
}
} catch (e) {
console.error(e);
status.textContent = "追跡処理でエラーが発生しました";
}
}
}
requestAnimationFrame(render);
}

document.getElementById("start").addEventListener("click", startCamera);
document.getElementById("switch").addEventListener("click", async () => {
backCamera = !backCamera;
await startCamera();
});
</script>
</body>
</html>
